<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Cebadísimos</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1b4d3e 0%, #2e7d32 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            background: #ffffff;
        }
        .btn-custom {
            background-color: #2e7d32;
            border: none;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn-custom:hover {
            background-color: #1b4d3e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-custom p-4">
                    <div class="text-center mb-4">
                        <h1 class="fw-bold text-success">Cebadísimos 🧉</h1>
                        <p class="text-muted small">Iniciá sesión o registrate para yerbar con estilo.</p>
                    </div>

                    <!-- Formulario que redirige a la tienda -->
                    <form action="/tienda">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold text-secondary">Nombre y Apellido</label>
                            <input type="text" class="form-control rounded-pill px-3" id="nombre" placeholder="Ej: Juan Pérez" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-secondary">Correo Electrónico</label>
                            <input type="email" class="form-control rounded-pill px-3" id="email" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="nacimiento" class="form-label fw-semibold text-secondary">Fecha de Nacimiento</label>
                            <input type="date" class="form-control rounded-pill px-3" id="nacimiento" required>
                        </div>
                        <button type="submit" class="btn btn-custom text-white w-100 rounded-pill py-2 mt-3 shadow-sm">Ingresar a la Tienda</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
